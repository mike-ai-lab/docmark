<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta http-equiv="content-language" content="en">
    <meta http-equiv="content-script-type" content="text/javascript">
    <meta http-equiv="content-style-type" content="text/css">
    <meta name="description" content="This is the online markdown editor with live preview.">

    <script>
      (function(){
        try {
          var BOOT_THEME_KEY = 'com.markdownlivepreview_theme';
          var BOOT_STYLE_KEY = 'com.markdownlivepreview.style_settings';
          var raw = localStorage.getItem(BOOT_THEME_KEY);
          var useDark = raw === 'dark';
          document.documentElement.setAttribute('data-theme', useDark ? 'dark' : 'light');

          var PREVIEW_CSS_LIGHT = 'css/github-markdown-light.css?v=1.12.0';
          var PREVIEW_CSS_DARK = 'css/github-markdown-dark_dimmed.css?v=1.12.0';
          var PREVIEW_CSS_GITBOOK = 'css/gitbook-style.css?v=1.12.0';
          var PREVIEW_CSS_VSCODE = 'css/vscode-style.css?v=1.12.0';
          
          var styleRaw = localStorage.getItem(BOOT_STYLE_KEY);
          var style = styleRaw || 'github';
          
          var href;
          if (style === 'gitbook') {
            href = PREVIEW_CSS_GITBOOK;
          } else if (style === 'vscode') {
            href = PREVIEW_CSS_VSCODE;
          } else {
            href = useDark ? PREVIEW_CSS_DARK : PREVIEW_CSS_LIGHT;
          }

          var link = document.createElement('link');
          link.id = 'gh-markdown-link';
          link.rel = 'stylesheet';
          link.type = 'text/css';
          link.href = href;
          document.head.appendChild(link);
          
          // Set highlight.js theme based on dark mode
          setTimeout(function() {
            var lightTheme = document.getElementById('hljs-light-theme');
            var darkTheme = document.getElementById('hljs-dark-theme');
            if (lightTheme && darkTheme) {
              lightTheme.disabled = useDark;
              darkTheme.disabled = !useDark;
            }
          }, 0);
        } catch (e) {
          // ignore — app will correct theme after load
        }
      })();
    </script>
    <link rel="stylesheet" type="text/css" href="css/style.css?v=1.12.0">
    <link rel="stylesheet" type="text/css" href="css/vscode-style.css?v=1.12.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light-theme">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark-theme" disabled>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
      // Make hljs available globally for the module
      window.hljs = hljs;
    </script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <title>Markdown Live Preview</title>
    <script type="module" crossorigin src="/assets/index-CQYx4kK_.js"></script>
  </head>

  <body>

        <div class="header-left">
            <div class="mofu-header-widget" id="mofu-nav-trigger">

                        <div class="mofu-eyes-row">

        </div>
        
        <div class="header-center">

                <div class="btn-item" id="paste-button"><a href="#">Paste</a></div>
                <div class="btn-item" id="copy-button"><a href="#">Copy</a></div>
                <div class="btn-item" id="undo-button"><a href="#">Undo</a></div>
                <div class="btn-item" id="beautify-button"><a href="#">Beautify</a></div>
                <div class="btn-item" id="clear-button"><a href="#">Clear</a></div>

            <div class="button-group">

                <div class="btn-item" id="insert-break-button"><a href="#">+ Break</a></div>
            </div>
            
            <div class="button-group">
                <div class="btn-item dropdown" id="export-dropdown">
                    <a href="#">Export ▾</a>
                    <div class="dropdown-content">
                        <a href="#" id="export-pdf-link">Export PDF</a>
                        <a href="#" id="print-pdf-link">Print to PDF</a>
                        <a href="#" id="export-html-link">Export HTML</a>
                    </div>
                </div>
                <div class="btn-item dropdown" id="settings-dropdown">
                    <a href="#">Settings ▾</a>
                    <div class="dropdown-content">
                        <label class="dropdown-item">
                            <input type="checkbox" id="sync-scroll-checkbox">
                            <span>Sync Scroll</span>
                        </label>
                        <label class="dropdown-item">
                            <input type="checkbox" id="sync-cursor-checkbox">

                        </label>
                        <label class="dropdown-item">
                            <input type="checkbox" id="helper-messages-checkbox">

                        </label>
                        <label class="dropdown-item">
                            <input type="checkbox" id="theme-checkbox">

                        </label>
                        <label class="dropdown-item">
                            <input type="checkbox" id="flip-panels-checkbox">

                        </label>
                        <label class="dropdown-item">
                            <input type="checkbox" id="vertical-layout-checkbox">
                            <span>Vertical Layout</span>
                        </label>
                        <label class="dropdown-item">
                            <input type="checkbox" id="toc-checkbox">
                            <span>Table of Contents</span>
                        </label>
                        <div class="dropdown-item">
                            <label>
                                <span>Style:</span>
                                <select id="style-selector">
                                    <option value="github">GitHub</option>
                                    <option value="gitbook">GitBook</option>
                                    <option value="vscode">VSCode</option>
                                </select>
                            </label>
                        </div>
                        <a href="#" id="pdf-settings-link">PDF Settings</a>
                    </div>
                </div>
                <div class="btn-item" id="cheatsheet-button">
                    <a href="#">Syntax Guide</a>
                </div>
            </div>
        </div>
        
        <div class="header-right">
            <div id="github"><a href="https://github.com/mike-ai-lab/docmark"><img src="image/GitHub-Mark-Light-32px.webp"></a></div>
        </div>
    </header>

    <div id="container" class="split-container">

        <div id="edit" class="column editor-pane">
            <div id="editor-wrapper">
                <div id="editor"></div>
            </div>
        </div>

        <div id="split-divider" class="split-divider"></div>

        <div id="preview" class="column preview-pane">
            <div id="preview-wrapper">
                <div id="output" class="content markdown-body"></div>
            </div>
        </div>

        <div id="cheatsheet-divider" class="split-divider cheatsheet-divider hidden"></div>

        <div id="cheatsheet-panel" class="column cheatsheet-pane hidden">
            <div class="cheatsheet-panel-header">
                <h3>Markdown Syntax Guide</h3>
                <button class="cheatsheet-close" id="cheatsheet-close-btn">×</button>
            </div>
            <div class="cheatsheet-panel-content" id="cheatsheet-content">
                <!-- Cheatsheet content will be inserted here -->
            </div>
        </div>

        <div id="toc-panel" class="column toc-pane hidden">
            <div class="toc-panel-header">
                <h3>Table of Contents</h3>
                <button class="toc-close" id="toc-close-btn">×</button>
            </div>
            <div class="toc-panel-content" id="toc-content">
                <!-- TOC will be inserted here -->
            </div>
        </div>
    </div>

    <footer></footer>
  </body>
