<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Muhamad's Element Inspector</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; background: #f4f4f4; }
        header { padding: 10px 20px; background: #333; color: white; display: flex; gap: 10px; align-items: center; }
        
        /* Layout */
        main { display: flex; flex: 1; overflow: hidden; gap: 10px; padding: 10px; }
        
        /* Left: Where the uploaded HTML renders */
        #render-window { flex: 1; border: 2px dashed #ccc; background: white; overflow: auto; position: relative; padding: 10px; }
        
        /* Right: The Text Editor / Paste area */
        #editor-window { width: 400px; display: flex; flex-direction: column; background: #1e1e1e; border-radius: 8px; color: #d4d4d4; }
        #editor-header { padding: 10px; background: #2d2d2d; font-size: 12px; font-weight: bold; border-bottom: 1px solid #3e3e3e; }
        #code-output { flex: 1; width: 100%; background: transparent; color: #9cdcfe; border: none; padding: 15px; font-family: 'Courier New', monospace; resize: none; outline: none; }
        
        /* Tooltip style */
        .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #4CAF50; color: white; padding: 10px 20px; border-radius: 5px; display: none; z-index: 1000; }
    </style>
</head>
<body>

<header>
    <input type="text" id="html-input" placeholder="Paste HTML code here..." style="flex: 1; padding: 8px;">
    <button onclick="renderHTML()">Render Design</button>
</header>

<main>
    <div id="render-window">
        <p style="color: #888; text-align: center;">Paste code above and click "Render". <br>Then right-click any element to copy its code.</p>
    </div>

    <div id="editor-window">
        <div id="editor-header">CLIPBOARD MONITOR (PASTE HERE TO TEST)</div>
        <textarea id="code-output" placeholder="// Right-click an element, then paste here to verify..."></textarea>
    </div>
</main>

<div id="copy-toast" class="copy-toast">Code copied to clipboard!</div>

<script>
    const renderWindow = document.getElementById('render-window');
    const htmlInput = document.getElementById('html-input');
    const codeOutput = document.getElementById('code-output');
    const toast = document.getElementById('copy-toast');

    // Function to render the provided HTML
    function renderHTML() {
        const rawHTML = htmlInput.value;
        renderWindow.innerHTML = rawHTML;
    }

    // Right-click logic
    renderWindow.addEventListener('contextmenu', (e) => {
        // Prevent clicking on the container itself if empty
        if (e.target === renderWindow) return;

        e.preventDefault();
        e.stopPropagation();

        const selectedCode = e.target.outerHTML;

        // Copy to system clipboard
        navigator.clipboard.writeText(selectedCode).then(() => {
            showToast();
            // Highlight the element briefly for visual feedback
            const originalOutline = e.target.style.outline;
            e.target.style.outline = "2px solid #007bff";
            setTimeout(() => e.target.style.outline = originalOutline, 500);
        });
    });

    function showToast() {
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2000);
    }

    // Execution Guide:
    // 1. Save this code as an .html file.
    // 2. Open it in any modern browser (Chrome/Edge/Safari).
    // 3. Paste a snippet like '<button style="color:red">Click Me</button>' into the top bar.
    // 4. Right-click the red button in the render window to copy its source.
</script>

</body>
</html>
