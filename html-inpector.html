<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architectural HTML Inspector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Toast Animation */
        @keyframes slideIn {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }

        /* Resizable Handle */
        .resizer { cursor: row-resize; height: 6px; background: #e2e8f0; transition: background 0.2s; }
        .resizer:hover { background: #6366f1; }
        
        #render-host { height: 100%; width: 100%; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between shrink-0 z-20 shadow-sm">
        <div class="flex items-center gap-4 w-full">
            <div class="flex gap-1.5">
                <div class="w-3 h-3 rounded-full bg-red-400"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
                <div class="w-3 h-3 rounded-full bg-green-400"></div>
            </div>
            <div class="flex-1 max-w-2xl bg-slate-100 rounded-md px-3 py-1.5 text-xs text-slate-500 font-mono flex items-center">
                <i class="fa-solid fa-lock text-slate-400 mr-2"></i>
                <span>preview://muhamad-design-inspector</span>
            </div>
            <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider">
                Style-Capture v2.5
            </div>
        </div>
    </header>

    <!-- 1. PREVIEW AREA -->
    <main class="flex-1 bg-white relative overflow-auto bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9IiNmMWY1ZjkiLz48L3N2Zz4=')]">
        <div id="render-host"></div>

        <!-- Notification Toast -->
        <div id="notification-toast" class="hidden fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl z-50 flex items-center gap-3 border border-slate-700 pointer-events-none">
            <div class="text-indigo-400"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
            <p class="text-sm font-medium">Code + Styles Copied!</p>
        </div>
    </main>

    <!-- Resizer -->
    <div id="drag-bar" class="resizer w-full shrink-0"></div>

    <!-- 2. EDITOR PANEL -->
    <section id="bottom-panel" class="h-72 bg-white border-t border-slate-200 flex flex-col shrink-0 shadow-lg z-30">
        <div class="flex border-b border-slate-200 bg-slate-50">
            <div class="px-4 py-2 text-xs font-bold text-indigo-600 bg-white border-r border-t-2 border-t-indigo-600 border-r-slate-200 flex items-center gap-2">
                <i class="fa-solid fa-layer-group"></i> WORKSPACE
            </div>
            <div class="flex-1 flex justify-end px-2 items-center gap-2">
                 <button onclick="clearAll()" class="text-[10px] uppercase font-bold text-slate-400 hover:text-red-500 px-3 py-1 transition-colors">Clear</button>
            </div>
        </div>

        <div class="flex-1 flex divide-x divide-slate-200">
            <!-- INPUT -->
            <div class="flex-1 flex flex-col relative group">
                <textarea id="source-input" class="w-full h-full p-4 font-mono text-xs md:text-sm resize-none focus:outline-none bg-slate-50/30 text-slate-700" 
                    placeholder="<!-- Paste your design HTML here -->"></textarea>
                <div class="absolute bottom-2 right-2 px-2 py-1 bg-white text-slate-400 text-[9px] font-bold rounded border shadow-sm pointer-events-none">RENDER INPUT</div>
            </div>

            <!-- VERIFY -->
            <div class="w-1/3 min-w-[320px] flex flex-col relative group bg-slate-900">
                <textarea id="verify-input" class="w-full h-full p-4 font-mono text-xs text-indigo-300 resize-none focus:outline-none bg-transparent" 
                    placeholder="// Verification Area: Paste here to see the copied code with inlined styles..."></textarea>
                <div class="absolute bottom-2 right-2 px-2 py-1 bg-slate-800 text-slate-500 text-[9px] font-bold rounded border border-slate-700 pointer-events-none">CLIPBOARD VERIFIER</div>
            </div>
        </div>
    </section>

    <script>
        const sourceInput = document.getElementById('source-input');
        const renderHost = document.getElementById('render-host');
        const verifyInput = document.getElementById('verify-input');
        const toast = document.getElementById('notification-toast');
        const dragBar = document.getElementById('drag-bar');
        const bottomPanel = document.getElementById('bottom-panel');

        const shadowRoot = renderHost.attachShadow({ mode: 'open' });

        // Logic to inline computed styles
        function getElementWithStyles(el) {
            const clone = el.cloneNode(true);
            const originalElements = [el, ...el.querySelectorAll('*')];
            const clonedElements = [clone, ...clone.querySelectorAll('*')];

            originalElements.forEach((orig, i) => {
                const styles = window.getComputedStyle(orig);
                let styleString = "";
                // Capture essential visual styles for architectural accuracy
                const props = ['color', 'background', 'background-color', 'padding', 'margin', 'border', 'border-radius', 'font-size', 'font-family', 'display', 'flex', 'grid', 'width', 'height', 'box-shadow', 'position', 'top', 'left', 'right', 'bottom', 'opacity', 'transform'];
                
                props.forEach(prop => {
                    styleString += `${prop}: ${styles.getPropertyValue(prop)}; `;
                });
                clonedElements[i].setAttribute('style', styleString);
            });
            return clone.outerHTML;
        }

        function render() {
            const html = sourceInput.value || `<div style="padding: 100px; text-align: center; color: #94a3b8;">
                <h2 style="font-size: 24px;">Welcome, Muhamad</h2>
                <p>Paste architectural HTML snippets below to begin inspecting.</p>
            </div>`;
            shadowRoot.innerHTML = `
                <style>
                    :host { display: block; width: 100%; height: 100%; font-family: sans-serif; }
                    *:hover { outline: 2px solid #6366f1 !important; outline-offset: -2px; cursor: crosshair !important; }
                </style>
                ${html}
            `;
        }

        sourceInput.addEventListener('input', render);

        // Right click extraction
        renderHost.addEventListener('contextmenu', async (e) => {
            e.preventDefault();
            const path = e.composedPath();
            let target = path[0];

            if (target.nodeType === Node.TEXT_NODE) target = target.parentElement;
            if (target === renderHost || target === shadowRoot) return;

            // Extract code with computed styles inlined
            const richCode = getElementWithStyles(target);

            try {
                // Use standard copy method
                const textArea = document.createElement("textarea");
                textArea.value = richCode;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                showToast();
            } catch (err) {
                console.error("Copy failed", err);
            }
        });

        // Resizer logic
        let isResizing = false;
        dragBar.addEventListener('mousedown', (e) => { isResizing = true; document.body.style.cursor = 'row-resize'; });
        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const newHeight = window.innerHeight - e.clientY;
            if (newHeight > 100 && newHeight < window.innerHeight - 100) {
                bottomPanel.style.height = `${newHeight}px`;
            }
        });
        document.addEventListener('mouseup', () => { isResizing = false; document.body.style.cursor = 'default'; });

        function showToast() {
            toast.classList.remove('hidden');
            toast.classList.add('toast-enter');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('toast-enter');
            }, 2000);
        }

        function clearAll() {
            sourceInput.value = '';
            verifyInput.value = '';
            render();
        }

        render();
    </script>
</body>
</html>
