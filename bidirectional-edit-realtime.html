<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-Draft | Live Bidirectional Editor</title>
    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/turndown/dist/turndown.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #2563eb;
            --bg-main: #ffffff;
            --bg-sidebar: #f8fafc;
            --border: #e2e8f0;
            --ghost-highlight: rgba(37, 99, 235, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: #1e293b;
            overflow: hidden;
            height: 100vh;
        }

        .editor-wrapper {
            display: flex;
            height: calc(100vh - 64px);
            width: 100%;
            position: relative;
        }

        .pane-left {
            min-width: 200px;
            background: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            transition: opacity 0.3s;
        }

        .pane-right {
            flex: 1;
            min-width: 200px;
            background: white;
            display: flex;
            flex-direction: column;
            transition: opacity 0.3s;
        }

        .scroll-container {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            position: relative;
        }

        .resizer {
            width: 8px;
            cursor: col-resize;
            background: transparent;
            position: relative;
            z-index: 20;
            transition: background 0.2s;
        }
        
        .resizer:hover, .resizer.dragging {
            background: var(--accent);
            opacity: 0.3;
        }

        #markdown-editor {
            font-family: 'Fira Code', monospace;
            background: transparent;
            resize: none;
            outline: none;
            line-height: 1.7;
            font-size: 14px;
            width: 100%;
            overflow: hidden; 
            padding: 40px;
            color: #475569;
            display: block;
            position: relative;
            z-index: 1;
        }

        /* The Ghost Highlight Overlay */
        #line-highlight-overlay {
            position: absolute;
            left: 0;
            right: 0;
            height: 1.7em;
            background: var(--ghost-highlight);
            pointer-events: none;
            transition: top 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 4px solid var(--accent);
            display: none;
            z-index: 0;
        }

        .preview-area {
            padding: 40px 60px;
            max-width: 900px;
            margin: 0 auto;
            min-height: 100%;
        }

        .preview-area [contenteditable="true"] {
            outline: none;
            border-radius: 4px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        /* Visual indicator for active panel */
        .active-pane-header {
            color: var(--accent) !important;
            border-bottom: 2px solid var(--accent) !important;
        }

        .preview-area [contenteditable="true"]:focus {
            background: rgba(37, 99, 235, 0.04);
            border-left: 3px solid var(--accent);
            padding-left: 12px;
        }

        .prose h1 { font-weight: 700; font-size: 2.25rem; margin-bottom: 1rem; color: #0f172a; }
        .prose h2 { font-weight: 600; font-size: 1.5rem; margin-top: 2rem; margin-bottom: 0.75rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 0.5rem; }
        .prose p { margin-bottom: 1.25rem; line-height: 1.8; color: #334155; }
        .prose blockquote { font-style: italic; border-left: 4px solid var(--accent); padding-left: 1.5rem; margin: 1.5rem 0; color: #475569; }
    </style>
</head>
<body class="bg-slate-50">

    <header class="h-16 border-b border-slate-200 bg-white flex items-center justify-between px-6 z-30 relative">
        <div class="flex items-center gap-4">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">P</div>
            <h1 class="font-semibold text-slate-800 tracking-tight">Pro-Draft <span class="text-slate-400 font-normal">/ Workspace</span></h1>
        </div>
        <div class="flex items-center gap-3">
            <div id="sync-status" class="text-[10px] font-bold text-emerald-500 uppercase flex items-center gap-2">
                <span class="w-2 h-2 bg-emerald-500 rounded-full"></span> Live Parallel
            </div>
        </div>
    </header>

    <div class="editor-wrapper" id="container">
        <!-- Left Pane -->
        <section class="pane-left border-r border-slate-200" style="width: 45%;">
            <div id="source-header" class="px-6 py-2 border-b border-slate-200 bg-slate-100/50 flex justify-between items-center text-[10px] font-bold text-slate-400 uppercase transition-all">
                <span>Markdown Source</span>
                <span id="line-indicator">Line 1</span>
            </div>
            <div class="scroll-container" id="left-scroll">
                <div id="line-highlight-overlay"></div>
                <textarea id="markdown-editor" spellcheck="false"># Architecture in Riyadh

The skyline of **Riyadh** is evolving at an unprecedented pace. 

## Key Landmarks
- **Kingdom Centre**: An iconic symbol of the city.
- **Al Faisaliyah Center**: A blend of modernism and tradition.

### The Vision
Saudi Arabia is currently integrating AI and smart-city technology into its architectural heritage. The balance of tradition and future-tech is visible in every new district.

Click any text on the right to auto-scroll here. The blue highlight follows you as you work.</textarea>
            </div>
        </section>

        <!-- Resizer -->
        <div class="resizer" id="drag-bar"></div>

        <!-- Right Pane -->
        <section class="pane-right">
            <div id="visual-header" class="px-6 py-2 border-b border-slate-200 bg-white flex justify-between items-center text-[10px] font-bold text-slate-400 uppercase transition-all">
                <span>Visual Canvas</span>
            </div>
            <div class="scroll-container" id="right-scroll">
                <div id="preview" class="preview-area prose prose-slate"></div>
            </div>
        </section>
    </div>

    <script>
        const editor = document.getElementById('markdown-editor');
        const preview = document.getElementById('preview');
        const container = document.getElementById('container');
        const dragBar = document.getElementById('drag-bar');
        const leftPane = document.querySelector('.pane-left');
        const leftScroll = document.getElementById('left-scroll');
        const rightScroll = document.getElementById('right-scroll');
        const status = document.getElementById('sync-status');
        const lineIndicator = document.getElementById('line-indicator');
        const ghostHighlight = document.getElementById('line-highlight-overlay');
        const sourceHeader = document.getElementById('source-header');
        const visualHeader = document.getElementById('visual-header');

        let isUpdating = false;
        let blockLineMap = new Map(); // Maps preview blocks to source line numbers
        const turndownService = new TurndownService({ headingStyle: 'atx', bulletListMarker: '-', codeBlockStyle: 'fenced' });

        function adjustEditorHeight() {
            editor.style.height = 'auto';
            editor.style.height = (editor.scrollHeight) + 'px';
        }

        // --- PANEL RESIZER ---
        let isDragging = false;
        dragBar.addEventListener('mousedown', () => { isDragging = true; dragBar.classList.add('dragging'); });
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const newLeftWidth = (e.clientX / container.offsetWidth) * 100;
            if (newLeftWidth > 15 && newLeftWidth < 85) leftPane.style.width = `${newLeftWidth}%`;
        });
        document.addEventListener('mouseup', () => { isDragging = false; dragBar.classList.remove('dragging'); });

        // --- BUILD LINE MAP ---
        function buildLineMap() {
            blockLineMap.clear();
            const lines = editor.value.split('\n');
            const blocks = preview.querySelectorAll('h1, h2, h3, h4, h5, h6, p, li, blockquote');
            
            let currentLine = 0;
            blocks.forEach((block) => {
                const blockText = block.innerText.trim();
                if (!blockText) return;
                
                // Find the line in source that matches this block
                for (let i = currentLine; i < lines.length; i++) {
                    const lineText = lines[i].trim().replace(/^#+\s*/, '').replace(/^\*\s*/, '').replace(/^-\s*/, '').replace(/^>\s*/, '');
                    if (lineText && blockText.startsWith(lineText.substring(0, Math.min(20, lineText.length)))) {
                        blockLineMap.set(block, i);
                        currentLine = i + 1;
                        break;
                    }
                }
            });
        }

        // --- SMART RENDER & SYNC ---
        function renderMarkdown() {
            if (isUpdating) return;
            isUpdating = true;
            
            preview.innerHTML = marked.parse(editor.value);
            adjustEditorHeight();
            buildLineMap();
            
            const blocks = preview.querySelectorAll('h1, h2, h3, h4, h5, h6, p, li, blockquote');
            
            blocks.forEach((block) => {
                block.setAttribute('contenteditable', 'true');
                
                block.addEventListener('focus', () => {
                    visualHeader.classList.add('active-pane-header');
                    sourceHeader.classList.remove('active-pane-header');
                    syncToSource(block);
                });

                block.addEventListener('input', () => {
                    const md = turndownService.turndown(preview.innerHTML);
                    editor.value = md;
                    adjustEditorHeight();
                    showSyncStatus();
                    buildLineMap();
                    syncToSource(block);
                });
            });
            isUpdating = false;
        }

        // --- SYNC FROM PREVIEW TO SOURCE ---
        function syncToSource(block) {
            const lineNum = blockLineMap.get(block);
            if (lineNum === undefined) return;
            
            ghostHighlight.style.display = 'block';
            const lineHeight = parseFloat(getComputedStyle(editor).lineHeight);
            const padding = 40;
            const topPos = (lineNum * lineHeight) + padding;
            
            ghostHighlight.style.top = `${topPos}px`;
            ghostHighlight.style.height = `${lineHeight}px`;
            leftScroll.scrollTo({ top: topPos - 100, behavior: 'smooth' });
            lineIndicator.innerText = `Line ${lineNum + 1}`;
        }

        // --- SYNC FROM SOURCE TO PREVIEW ---
        function syncToPreview() {
            const cursorPos = editor.selectionStart;
            const textBeforeCursor = editor.value.substring(0, cursorPos);
            const currentLine = textBeforeCursor.split('\n').length - 1;
            
            lineIndicator.innerText = `Line ${currentLine + 1}`;
            
            // Find the corresponding block in preview
            let targetBlock = null;
            let closestLine = -1;
            
            blockLineMap.forEach((lineNum, block) => {
                if (lineNum <= currentLine && lineNum > closestLine) {
                    closestLine = lineNum;
                    targetBlock = block;
                }
            });
            
            if (targetBlock) {
                // Highlight the block in preview
                const blocks = preview.querySelectorAll('h1, h2, h3, h4, h5, h6, p, li, blockquote');
                blocks.forEach(b => b.style.background = '');
                targetBlock.style.background = 'rgba(37, 99, 235, 0.08)';
                targetBlock.style.transition = 'background 0.3s';
                
                // Scroll to it
                targetBlock.scrollIntoView({ behavior: 'smooth', block: 'center' });
                
                // Remove highlight after a moment
                setTimeout(() => {
                    targetBlock.style.background = '';
                }, 1000);
            }
        }

        // --- SOURCE INTERACTIONS ---
        editor.addEventListener('focus', () => {
            sourceHeader.classList.add('active-pane-header');
            visualHeader.classList.remove('active-pane-header');
            ghostHighlight.style.display = 'none';
        });

        editor.addEventListener('keyup', syncToPreview);
        editor.addEventListener('click', syncToPreview);

        function showSyncStatus() {
            status.innerHTML = `<span class="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span> Syncing`;
            setTimeout(() => {
                status.innerHTML = `<span class="w-2 h-2 bg-emerald-500 rounded-full"></span> Live Parallel`;
            }, 600);
        }

        editor.addEventListener('input', () => {
            renderMarkdown();
            showSyncStatus();
        });
        
        window.addEventListener('load', renderMarkdown);
        renderMarkdown();
    </script>
</body>
</html>
