<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-Draft | Live Bidirectional Editor</title>
    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/turndown/dist/turndown.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #2563eb;
            --bg-main: #ffffff;
            --bg-sidebar: #f8fafc;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: #1e293b;
            overflow: hidden;
            height: 100vh;
        }

        .editor-wrapper {
            display: flex;
            height: calc(100vh - 64px);
            width: 100%;
            position: relative;
        }

        .pane-left, .pane-right {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .scroll-container {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            position: relative;
        }

        .editor-container {
            display: flex;
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        .line-numbers {
            background: #f1f5f9;
            color: #94a3b8;
            padding: 40px 12px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            line-height: 2;
            text-align: right;
            user-select: none;
            border-right: 1px solid #e2e8f0;
            min-width: 50px;
        }

        .line-numbers .line-num {
            display: block;
            height: 28px;
        }

        .line-numbers .line-num.active {
            color: var(--accent);
            font-weight: 600;
        }

        .resizer {
            width: 6px;
            cursor: col-resize;
            background: var(--border);
            z-index: 20;
            transition: background 0.2s;
        }
        
        .resizer:hover, .resizer.dragging {
            background: var(--accent);
        }

        #markdown-editor {
            font-family: 'Fira Code', monospace;
            background: transparent;
            resize: none;
            outline: none;
            line-height: 2; /* Fixed line height for calculation */
            font-size: 14px;
            width: 100%;
            min-height: 100%;
            padding: 40px 40px 40px 20px;
            color: #475569;
            display: block;
            border: none;
        }

        #markdown-editor:focus {
            outline: none;
        }

        .preview-area {
            padding: 40px 60px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Bidirectional Focus Highlights */
        .preview-area [data-line] {
            outline: none;
            border-left: 3px solid transparent;
            padding-left: 15px;
            margin-left: -18px;
            transition: border 0.2s, background 0.2s;
            cursor: text;
            position: relative;
        }

        .preview-area [data-line]::before {
            content: attr(data-line-range);
            position: absolute;
            left: -50px;
            top: 0;
            font-size: 10px;
            color: #cbd5e1;
            font-family: 'Fira Code', monospace;
            font-weight: 500;
        }

        .preview-area [data-line]:hover {
            border-left-color: #e2e8f0;
        }

        .preview-area [data-line]:hover::before {
            color: #94a3b8;
        }

        .preview-area [data-line]:focus {
            background: rgba(37, 99, 235, 0.04);
            border-left-color: var(--accent);
        }

        .preview-area [data-line].highlight {
            background: rgba(37, 99, 235, 0.08);
            border-left-color: var(--accent);
        }

        /* Markdown Styling */
        .prose h1 { font-weight: 800; font-size: 2.5rem; margin-bottom: 1.5rem; color: #0f172a; }
        .prose h2 { font-weight: 700; font-size: 1.75rem; margin-top: 2rem; margin-bottom: 1rem; color: #1e293b; }
        .prose p { margin-bottom: 1.5rem; line-height: 1.8; color: #334155; }
        .prose blockquote { font-style: italic; border-left: 4px solid var(--accent); padding-left: 1.5rem; color: #475569; }
    </style>
</head>
<body class="bg-slate-50">

    <header class="h-16 border-b border-slate-200 bg-white flex items-center justify-between px-6 z-30 relative">
        <div class="flex items-center gap-4">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">P</div>
            <h1 class="font-semibold text-slate-800 tracking-tight">Pro-Draft <span class="text-slate-400 font-normal">/ Smart Workspace</span></h1>
        </div>
        <div class="flex items-center gap-6">
            <div id="sync-status" class="text-[10px] font-bold text-emerald-500 uppercase flex items-center gap-2">
                <span class="w-2 h-2 bg-emerald-500 rounded-full"></span> Bidirectional Active
            </div>
        </div>
    </header>

    <div class="editor-wrapper" id="container">
        <section class="pane-left border-r border-slate-200" style="width: 50%;">
            <div class="px-6 py-2 border-b border-slate-200 bg-slate-50 flex justify-between items-center text-[10px] font-bold text-slate-400 uppercase">
                <span>Markdown Source</span>
                <span id="line-indicator">Line 1</span>
            </div>
            <div class="editor-container">
                <div id="line-numbers" class="line-numbers"></div>
                <div class="scroll-container" id="left-scroll" style="flex: 1;">
                    <textarea id="markdown-editor" spellcheck="false"># Architectural Strategy Riyadh

The development of the **King Salman Park** district represents a shift towards sustainable urbanism in Saudi Arabia.

## Project Objectives
- Integration of native vegetation.
- Smart irrigation systems using AI.
- Cultural pavilions reflecting Najdi heritage.

### Ghost Writing Feature
You can click any paragraph on the right and start typing. The changes will update here in the source code instantly without any lag.

### Line Tracking
Move your cursor through these lines. Notice how the visual renderer on the right automatically scrolls to the specific element you are working on.</textarea>
                </div>
            </div>
        </section>

        <div class="resizer" id="drag-bar"></div>

        <section class="pane-right" style="flex: 1;">
            <div class="px-6 py-2 border-b border-slate-200 bg-white flex justify-between items-center text-[10px] font-bold text-slate-400 uppercase">
                <span>Visual Canvas</span>
            </div>
            <div class="scroll-container" id="right-scroll">
                <div id="preview" class="preview-area prose"></div>
            </div>
        </section>
    </div>

    <script>
        const editor = document.getElementById('markdown-editor');
        const preview = document.getElementById('preview');
        const container = document.getElementById('container');
        const dragBar = document.getElementById('drag-bar');
        const leftPane = document.querySelector('.pane-left');
        const leftScroll = document.getElementById('left-scroll');
        const rightScroll = document.getElementById('right-scroll');
        const status = document.getElementById('sync-status');
        const lineIndicator = document.getElementById('line-indicator');
        const lineNumbers = document.getElementById('line-numbers');

        const turndownService = new TurndownService({ 
            headingStyle: 'atx', 
            bulletListMarker: '-',
            hr: '---'
        });

        let isLocked = false;
        let lineMap = [];
        let updateTimeout = null;
        let highlightTimeout = null;

        console.log('🚀 App initialized');

        // --- LINE NUMBERING ---
        function updateLineNumbers() {
            const lines = editor.value.split('\n');
            const currentLine = editor.value.substr(0, editor.selectionStart).split('\n').length;
            
            lineNumbers.innerHTML = lines.map((_, i) => 
                `<span class="line-num ${i + 1 === currentLine ? 'active' : ''}">${i + 1}</span>`
            ).join('');
        }

        // Sync line numbers scroll with editor
        leftScroll.addEventListener('scroll', () => {
            lineNumbers.scrollTop = leftScroll.scrollTop;
        });

        // --- IMPROVED LINE MAPPING ---
        function buildLineMap(content) {
            const lines = content.split('\n');
            const map = new Map(); // line number -> element info
            
            try {
                const tokens = marked.lexer(content);
                let lineCounter = 0;
                
                function processToken(token, depth = 0) {
                    const raw = token.raw || '';
                    const startLine = lineCounter + 1;
                    const lineCount = raw.split('\n').length - 1;
                    const endLine = lineCounter + lineCount;
                    
                    // Only map block-level tokens
                    const blockTypes = ['heading', 'paragraph', 'list', 'list_item', 'blockquote', 'code', 'hr', 'table'];
                    
                    if (blockTypes.includes(token.type)) {
                        // Store mapping for each line in this block
                        for (let i = startLine; i <= endLine; i++) {
                            if (!map.has(i)) { // Don't overwrite with nested elements
                                map.set(i, {
                                    type: token.type,
                                    startLine: startLine,
                                    endLine: endLine,
                                    text: (token.text || raw).substring(0, 50),
                                    depth: depth
                                });
                            }
                        }
                    }
                    
                    lineCounter += lineCount;
                    
                    // Process nested tokens
                    if (token.tokens && Array.isArray(token.tokens)) {
                        token.tokens.forEach(t => processToken(t, depth + 1));
                    }
                    
                    // Process list items
                    if (token.items && Array.isArray(token.items)) {
                        token.items.forEach(item => processToken(item, depth + 1));
                    }
                }
                
                tokens.forEach(token => processToken(token));
                
                console.log('📊 Line map coverage:', map.size, 'lines mapped');
                
            } catch (e) {
                console.error('❌ Line mapping error:', e);
            }
            
            return map;
        }

        // --- 1. GHOST WRITING: Instant Bidirectional Propagation ---
        
        function updateFromSource() {
            if (isLocked) {
                console.log('⏸️ Update locked');
                return;
            }
            
            console.log('🔄 Updating from source');
            const content = editor.value;
            
            // Build line map
            lineMap = buildLineMap(content);
            
            // Render markdown
            preview.innerHTML = marked.parse(content);
            
            // Inject line data into rendered elements
            const blocks = preview.querySelectorAll('h1, h2, h3, h4, h5, h6, p, li, blockquote, pre, hr, table');
            console.log('🎯 Found', blocks.length, 'blocks to annotate');
            
            // Match blocks to line ranges by content
            const lines = content.split('\n');
            let currentSearchLine = 0;
            
            blocks.forEach((block) => {
                const blockText = block.textContent.trim().substring(0, 30);
                
                // Search for this block's text in the source
                for (let i = currentSearchLine; i < lines.length; i++) {
                    const lineText = lines[i].trim();
                    
                    // Check if this line contains the block text or starts the block
                    if (lineText.includes(blockText.substring(0, 15)) || 
                        blockText.includes(lineText.substring(0, 15))) {
                        
                        // Found it! Now find the range
                        const lineInfo = lineMap.get(i + 1);
                        
                        if (lineInfo) {
                            block.setAttribute('data-line', lineInfo.startLine);
                            block.setAttribute('data-line-end', lineInfo.endLine);
                            
                            if (lineInfo.endLine > lineInfo.startLine) {
                                block.setAttribute('data-line-range', `${lineInfo.startLine}-${lineInfo.endLine}`);
                            } else {
                                block.setAttribute('data-line-range', `${lineInfo.startLine}`);
                            }
                            
                            block.setAttribute('contenteditable', 'true');
                            block.classList.add('editable-block');
                            
                            currentSearchLine = lineInfo.endLine;
                            console.log('✓ Mapped block to lines', lineInfo.startLine, '-', lineInfo.endLine, ':', blockText.substring(0, 20));
                            break;
                        }
                    }
                }
            });
            
            updateLineNumbers();
            console.log('✅ Update complete');
        }

        // --- EVENT DELEGATION for preview clicks (prevents handler loss) ---
        preview.addEventListener('mousedown', (e) => {
            const target = e.target.closest('[data-line]');
            if (!target) return;
            
            const startLine = parseInt(target.getAttribute('data-line'));
            const endLine = parseInt(target.getAttribute('data-line-end') || startLine);
            
            console.log('👆 Clicked block:', startLine, '-', endLine);
            
            // Highlight the block
            preview.querySelectorAll('[data-line]').forEach(b => b.classList.remove('highlight'));
            target.classList.add('highlight');
            
            // Calculate editor scroll position
            const lineHeight = 28; // match css line-height (2 * 14px)
            const targetLineTop = (startLine - 1) * lineHeight;
            const containerHeight = leftScroll.clientHeight;
            const scrollTarget = targetLineTop - (containerHeight / 2);
            
            console.log('📜 Scrolling editor to line', startLine, 'scroll position:', Math.max(0, scrollTarget));
            
            leftScroll.scrollTo({ 
                top: Math.max(0, scrollTarget), 
                behavior: 'smooth' 
            });
            
            lineIndicator.innerText = endLine > startLine 
                ? `Lines ${startLine}-${endLine}` 
                : `Line ${startLine}`;
            
            updateLineNumbers();
        });

        preview.addEventListener('input', (e) => {
            const target = e.target.closest('[data-line]');
            if (!target) return;
            
            console.log('✏️ Editing in preview');
            isLocked = true;
            
            clearTimeout(updateTimeout);
            updateTimeout = setTimeout(() => {
                const md = turndownService.turndown(preview.innerHTML);
                editor.value = md;
                showSync();
                
                setTimeout(() => {
                    isLocked = false;
                    updateFromSource();
                }, 100);
            }, 300);
        });

        preview.addEventListener('focus', (e) => {
            const target = e.target.closest('[data-line]');
            if (target) target.classList.add('highlight');
        }, true);

        preview.addEventListener('blur', (e) => {
            const target = e.target.closest('[data-line]');
            if (target) target.classList.remove('highlight');
        }, true);

        // --- 3. LINE TRACKING: Cursor Move -> Scroll Visual ---
        function handleCursorMove(e) {
            const pos = editor.selectionStart;
            const currentLine = editor.value.substr(0, pos).split('\n').length;
            lineIndicator.innerText = `Line ${currentLine}`;
            updateLineNumbers();

            console.log('📍 Cursor at line:', currentLine);

            // Find the block that contains this line
            let targetBlock = Array.from(preview.querySelectorAll('[data-line]')).find(el => {
                const start = parseInt(el.getAttribute('data-line'));
                const end = parseInt(el.getAttribute('data-line-end') || start);
                return currentLine >= start && currentLine <= end;
            });

            // If no exact match, find the closest block before this line
            if (!targetBlock) {
                console.log('⚠️ No exact match, finding closest block...');
                let closestBlock = null;
                let closestDistance = Infinity;
                
                preview.querySelectorAll('[data-line]').forEach(el => {
                    const start = parseInt(el.getAttribute('data-line'));
                    const distance = Math.abs(currentLine - start);
                    
                    if (start <= currentLine && distance < closestDistance) {
                        closestDistance = distance;
                        closestBlock = el;
                    }
                });
                
                targetBlock = closestBlock;
                
                if (targetBlock) {
                    console.log('🔍 Found closest block at line', targetBlock.getAttribute('data-line'));
                }
            }

            if (targetBlock) {
                console.log('🎯 Found target block for line', currentLine);
                
                // Remove previous highlights
                preview.querySelectorAll('[data-line]').forEach(b => b.classList.remove('highlight'));
                
                // Highlight current block
                targetBlock.classList.add('highlight');
                
                // Get position relative to the scrollable container
                const blockRect = targetBlock.getBoundingClientRect();
                const containerRect = rightScroll.getBoundingClientRect();
                const currentScroll = rightScroll.scrollTop;
                
                // Calculate where the block is relative to container top
                const blockRelativeTop = blockRect.top - containerRect.top + currentScroll;
                
                // Center it in the viewport
                const containerHeight = rightScroll.clientHeight;
                const scrollTarget = blockRelativeTop - (containerHeight / 2) + (blockRect.height / 2);
                
                console.log('📜 Scrolling preview to:', Math.max(0, scrollTarget), 'Current:', currentScroll);
                
                // Scroll the container
                rightScroll.scrollTo({ 
                    top: Math.max(0, scrollTarget), 
                    behavior: 'smooth' 
                });
                
                // Auto-remove highlight after a moment
                clearTimeout(highlightTimeout);
                highlightTimeout = setTimeout(() => {
                    targetBlock.classList.remove('highlight');
                }, 1500);
            } else {
                console.log('❌ No block found for line', currentLine);
            }
        }

        // Debounced input handler
        let inputTimeout = null;
        editor.addEventListener('input', () => {
            updateLineNumbers();
            
            clearTimeout(inputTimeout);
            inputTimeout = setTimeout(() => {
                if (!isLocked) {
                    console.log('⌨️ Input detected, updating...');
                    updateFromSource();
                }
            }, 300);
        });

        editor.addEventListener('keyup', handleCursorMove);
        editor.addEventListener('click', handleCursorMove);

        // UI Helpers
        function showSync() {
            status.innerHTML = `<span class="w-2 h-2 bg-blue-500 rounded-full animate-ping"></span> Syncing`;
            clearTimeout(window.st);
            window.st = setTimeout(() => {
                status.innerHTML = `<span class="w-2 h-2 bg-emerald-500 rounded-full"></span> Bidirectional Active`;
            }, 500);
        }

        // Panel Resizing
        let isDragging = false;
        dragBar.addEventListener('mousedown', () => {
            isDragging = true;
            dragBar.classList.add('dragging');
        });
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const p = (e.clientX / container.offsetWidth) * 100;
            if (p > 10 && p < 90) leftPane.style.width = `${p}%`;
        });
        document.addEventListener('mouseup', () => {
            isDragging = false;
            dragBar.classList.remove('dragging');
        });

        // Initialize
        window.addEventListener('load', () => {
            console.log('🎬 Loading app...');
            updateFromSource();
            updateLineNumbers();
            console.log('✨ App ready!');
        });
    </script>
</body>
</html>
