<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Muhamad's Design Studio: Inspector & Editor</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --panel-bg: #1e1e1e; --accent: #ff9800; --text: #eee; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; display: flex; height: 100vh; background: #121212; color: var(--text); overflow: hidden; }
        
        /* Layout */
        #main { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; }
        #sidebar { width: 320px; min-width: 320px; max-width: 320px; background: var(--panel-bg); border-left: 2px solid #333; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        
        /* Controls */
        #toolbar { padding: 15px; background: var(--panel-bg); border-bottom: 2px solid #333; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .toolbar-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .icon-btn { background: #2b2b2b; border: 1px solid #444; color: white; padding: 8px 12px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .icon-btn:hover { background: #3b3b3b; }
        .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #urlInput { min-width: 250px; flex: 1; }
        #baseUrl { min-width: 150px; }
        #viewer { flex-grow: 1; width: 100%; border: none; background: white; }
        
        /* Editor UI */
        .editor-group { display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #444; padding-bottom: 15px; }
        label { font-size: 11px; color: #888; text-transform: uppercase; font-weight: bold; }
        input, select { background: #2b2b2b; border: 1px solid #444; color: white; padding: 8px; border-radius: 4px; }
        #copyIndicator { background: #2e7d32; color: white; padding: 10px; border-radius: 4px; text-align: center; display: none; margin-top: 10px; }
        
        .empty-state { color: #666; font-style: italic; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

    <div id="main">
        <div id="toolbar">
            <div class="toolbar-row" style="width: 100%;">
                <input type="file" id="fileInput" accept=".html">
                <span style="color: #666;">OR</span>
                <input type="text" id="urlInput" placeholder="Enter URL (e.g., https://example.com)">
                <button id="loadUrlBtn" class="icon-btn">
                    <i data-lucide="globe"></i> Load
                </button>
            </div>
            <div class="toolbar-row" style="width: 100%;">
                <input type="text" id="baseUrl" placeholder="Base URL (Optional)">
                <button id="undoBtn" class="icon-btn" disabled>
                    <i data-lucide="undo"></i> Undo
                </button>
                <button id="redoBtn" class="icon-btn" disabled>
                    <i data-lucide="redo"></i> Redo
                </button>
            </div>
        </div>
        <iframe id="viewer"></iframe>
    </div>

    <div id="sidebar">
        <h3>Element Editor</h3>
        <div id="editorUI" style="display:none; flex-direction: column;">
            <!-- Text & Typography -->
            <div class="editor-group">
                <label>Text Content</label>
                <input type="text" id="propText">
            </div>
            <div class="editor-group">
                <label>Font Family</label>
                <select id="propFontFamily">
                    <option value="inherit">Inherit</option>
                    <option value="Arial, sans-serif">Arial</option>
                    <option value="'Segoe UI', Tahoma, sans-serif">Segoe UI</option>
                    <option value="'Times New Roman', serif">Times New Roman</option>
                    <option value="Georgia, serif">Georgia</option>
                    <option value="'Courier New', monospace">Courier New</option>
                    <option value="Verdana, sans-serif">Verdana</option>
                </select>
            </div>
            <div class="editor-group">
                <label>Font Size (px)</label>
                <input type="number" id="propFontSize">
            </div>
            <div class="editor-group">
                <label>Font Weight</label>
                <select id="propFontWeight">
                    <option value="normal">Normal</option>
                    <option value="bold">Bold</option>
                    <option value="lighter">Lighter</option>
                    <option value="100">100</option>
                    <option value="300">300</option>
                    <option value="500">500</option>
                    <option value="700">700</option>
                    <option value="900">900</option>
                </select>
            </div>
            
            <!-- Colors -->
            <div class="editor-group">
                <label>Text Color</label>
                <input type="color" id="propColor">
            </div>
            <div class="editor-group">
                <label>Background Color</label>
                <input type="color" id="propBg">
            </div>
            
            <!-- Spacing -->
            <div class="editor-group">
                <label>Padding (px)</label>
                <input type="number" id="propPadding">
            </div>
            <div class="editor-group">
                <label>Margin (px)</label>
                <input type="number" id="propMargin">
            </div>
            
            <!-- Dimensions -->
            <div class="editor-group">
                <label>Width (px or auto)</label>
                <input type="text" id="propWidth" placeholder="auto">
            </div>
            <div class="editor-group">
                <label>Height (px or auto)</label>
                <input type="text" id="propHeight" placeholder="auto">
            </div>
            
            <!-- Border -->
            <div class="editor-group">
                <label>Border Width (px)</label>
                <input type="number" id="propBorderWidth" min="0">
            </div>
            <div class="editor-group">
                <label>Border Style</label>
                <select id="propBorderStyle">
                    <option value="none">None</option>
                    <option value="solid">Solid</option>
                    <option value="dashed">Dashed</option>
                    <option value="dotted">Dotted</option>
                    <option value="double">Double</option>
                </select>
            </div>
            <div class="editor-group">
                <label>Border Color</label>
                <input type="color" id="propBorderColor">
            </div>
            <div class="editor-group">
                <label>Border Radius (px)</label>
                <input type="number" id="propBorderRadius" min="0">
            </div>
            
            <!-- Display & Alignment -->
            <div class="editor-group">
                <label>Text Align</label>
                <select id="propTextAlign">
                    <option value="left">Left</option>
                    <option value="center">Center</option>
                    <option value="right">Right</option>
                    <option value="justify">Justify</option>
                </select>
            </div>
            <div class="editor-group">
                <label>Display</label>
                <select id="propDisplay">
                    <option value="block">Block</option>
                    <option value="inline">Inline</option>
                    <option value="inline-block">Inline Block</option>
                    <option value="flex">Flex</option>
                    <option value="none">None (Hide)</option>
                </select>
            </div>
            
            <!-- Actions -->
            <button id="deleteBtn" style="background: #d32f2f; color: white; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px;">
                DELETE ELEMENT
            </button>
            <button id="copyBtn" style="background: var(--accent); color: black; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px;">
                COPY UPDATED HTML
            </button>
            <button id="exportBtn" style="background: #2e7d32; color: white; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px;">
                EXPORT FULL HTML
            </button>
            <div id="copyIndicator">COPIED!</div>
        </div>
        <div id="emptyMsg" class="empty-state">Click an element to edit</div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const viewer = document.getElementById('viewer');
        const editorUI = document.getElementById('editorUI');
        const emptyMsg = document.getElementById('emptyMsg');
        let selectedElement = null;

        // History management
        let history = [];
        let historyIndex = -1;
        const MAX_HISTORY = 50;

        function saveState() {
            const doc = viewer.contentWindow.document;
            if (!doc.body) return;
            
            const state = doc.documentElement.outerHTML;
            
            // Remove future states if we're not at the end
            if (historyIndex < history.length - 1) {
                history = history.slice(0, historyIndex + 1);
            }
            
            history.push(state);
            if (history.length > MAX_HISTORY) {
                history.shift();
            } else {
                historyIndex++;
            }
            
            updateHistoryButtons();
            saveToLocalStorage();
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                restoreState(history[historyIndex]);
                updateHistoryButtons();
            }
        }

        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                restoreState(history[historyIndex]);
                updateHistoryButtons();
            }
        }

        function restoreState(html) {
            const doc = viewer.contentWindow.document;
            doc.open();
            doc.write(html);
            doc.close();
            setTimeout(() => initInspector(doc), 200);
        }

        function updateHistoryButtons() {
            document.getElementById('undoBtn').disabled = historyIndex <= 0;
            document.getElementById('redoBtn').disabled = historyIndex >= history.length - 1;
        }

        // LocalStorage persistence
        function saveToLocalStorage() {
            try {
                localStorage.setItem('htmlInspector_history', JSON.stringify(history));
                localStorage.setItem('htmlInspector_index', historyIndex);
            } catch (e) {
                console.warn('Failed to save to localStorage:', e);
            }
        }

        function loadFromLocalStorage() {
            try {
                const savedHistory = localStorage.getItem('htmlInspector_history');
                const savedIndex = localStorage.getItem('htmlInspector_index');
                
                if (savedHistory) {
                    history = JSON.parse(savedHistory);
                    historyIndex = parseInt(savedIndex) || 0;
                    
                    if (history.length > 0) {
                        restoreState(history[historyIndex]);
                        updateHistoryButtons();
                    }
                }
            } catch (e) {
                console.warn('Failed to load from localStorage:', e);
            }
        }

        // Undo/Redo buttons
        document.getElementById('undoBtn').addEventListener('click', undo);
        document.getElementById('redoBtn').addEventListener('click', redo);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'z' && !e.shiftKey) {
                e.preventDefault();
                undo();
            } else if (e.ctrlKey && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
                e.preventDefault();
                redo();
            }
        });

        // Load saved state on startup
        window.addEventListener('load', () => {
            lucide.createIcons();
            loadFromLocalStorage();
        });

        // 1. Load HTML from file
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                let html = event.target.result;
                const base = document.getElementById('baseUrl').value;
                if(base) html = html.replace('<head>', `<head><base href="${base}">`);
                
                const doc = viewer.contentWindow.document;
                doc.open(); doc.write(html); doc.close();
                setTimeout(() => {
                    initInspector(doc);
                    saveState(); // Save initial state
                }, 200);
            };
            reader.readAsText(file);
        });

        // 2. Load HTML from URL (with CORS proxy)
        document.getElementById('loadUrlBtn').addEventListener('click', async () => {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) {
                alert('Please enter a URL');
                return;
            }

            try {
                // Show loading indicator
                const btn = document.getElementById('loadUrlBtn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i data-lucide="loader"></i> Loading...';
                btn.disabled = true;
                lucide.createIcons();

                // Try multiple CORS proxies
                const proxies = [
                    'https://api.allorigins.win/raw?url=',
                    'https://corsproxy.io/?',
                    'https://api.codetabs.com/v1/proxy?quest='
                ];

                let html = null;
                let lastError = null;

                for (const proxy of proxies) {
                    try {
                        console.log(`Trying proxy: ${proxy}`);
                        const response = await fetch(proxy + encodeURIComponent(url), {
                            headers: {
                                'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
                            }
                        });
                        
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                        }
                        
                        html = await response.text();
                        
                        // Check if we got actual HTML
                        if (html && html.length > 0) {
                            console.log(`Success with proxy: ${proxy}`);
                            break;
                        }
                    } catch (err) {
                        console.warn(`Proxy ${proxy} failed:`, err.message);
                        lastError = err;
                        continue;
                    }
                }

                if (!html) {
                    throw new Error(`All proxies failed. Last error: ${lastError?.message || 'Unknown error'}`);
                }
                
                // Auto-set base URL if not provided
                const baseUrlInput = document.getElementById('baseUrl');
                if (!baseUrlInput.value) {
                    try {
                        const urlObj = new URL(url);
                        baseUrlInput.value = urlObj.origin + urlObj.pathname.substring(0, urlObj.pathname.lastIndexOf('/') + 1);
                    } catch (e) {
                        console.warn('Could not parse URL for base:', e);
                    }
                }
                
                const base = baseUrlInput.value;
                if(base && html.includes('<head>')) {
                    html = html.replace('<head>', `<head><base href="${base}">`);
                } else if (base && html.includes('<HEAD>')) {
                    html = html.replace('<HEAD>', `<HEAD><base href="${base}">`);
                }
                
                const doc = viewer.contentWindow.document;
                doc.open(); 
                doc.write(html); 
                doc.close();
                
                setTimeout(() => {
                    initInspector(doc);
                    saveState();
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    lucide.createIcons();
                }, 300);

            } catch (error) {
                console.error('Full error:', error);
                alert(`Failed to load URL: ${error.message}\n\nDebugging info:\n- URL: ${url}\n- Error: ${error.stack || error.message}\n\nTry:\n1. Check if the URL is accessible\n2. Save the page as HTML and upload it instead\n3. Check browser console for details`);
                const btn = document.getElementById('loadUrlBtn');
                btn.innerHTML = '<i data-lucide="globe"></i> Load';
                btn.disabled = false;
                lucide.createIcons();
            }
        });

        // Allow Enter key to load URL
        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loadUrlBtn').click();
            }
        });

        // 2. Inspector Logic
        function initInspector(doc) {
            const style = doc.createElement('style');
            style.textContent = `
                * { user-select: none !important; transition: outline 0.1s; }
                *.active-inspect { outline: 3px solid #ff9800 !important; outline-offset: -3px; }
                *:hover { outline: 2px dashed #ff9800 !important; cursor: pointer; }
            `;
            doc.head.appendChild(style);

            doc.addEventListener('click', (e) => {
                e.preventDefault();
                if(selectedElement) selectedElement.classList.remove('active-inspect');
                
                selectedElement = e.target;
                selectedElement.classList.add('active-inspect');
                
                showEditor(selectedElement);
            });

            // Double-click to copy HTML
            doc.addEventListener('dblclick', (e) => {
                e.preventDefault();
                const element = e.target;
                element.classList.remove('active-inspect');
                const code = element.outerHTML;
                element.classList.add('active-inspect');
                
                navigator.clipboard.writeText(code).then(() => {
                    const indicator = document.getElementById('copyIndicator');
                    indicator.textContent = 'COPIED VIA DOUBLE-CLICK!';
                    indicator.style.display = 'block';
                    setTimeout(() => indicator.style.display = 'none', 2000);
                });
            });
        }

        // 3. Editor Logic
        function showEditor(el) {
            emptyMsg.style.display = 'none';
            editorUI.style.display = 'flex';
            
            const style = window.getComputedStyle(el);
            document.getElementById('propText').value = el.innerText || "";
            document.getElementById('propFontFamily').value = style.fontFamily;
            document.getElementById('propFontSize').value = parseInt(style.fontSize);
            document.getElementById('propFontWeight').value = style.fontWeight;
            document.getElementById('propColor').value = rgbToHex(style.color);
            document.getElementById('propBg').value = rgbToHex(style.backgroundColor);
            document.getElementById('propPadding').value = parseInt(style.padding);
            document.getElementById('propMargin').value = parseInt(style.margin);
            document.getElementById('propWidth').value = style.width === 'auto' ? 'auto' : parseInt(style.width);
            document.getElementById('propHeight').value = style.height === 'auto' ? 'auto' : parseInt(style.height);
            document.getElementById('propBorderWidth').value = parseInt(style.borderWidth) || 0;
            document.getElementById('propBorderStyle').value = style.borderStyle;
            document.getElementById('propBorderColor').value = rgbToHex(style.borderColor);
            document.getElementById('propBorderRadius').value = parseInt(style.borderRadius) || 0;
            document.getElementById('propTextAlign').value = style.textAlign;
            document.getElementById('propDisplay').value = style.display;
        }

        // Update element live
        const styleUpdaters = {
            propText: (el, val) => el.innerText = val,
            propFontFamily: (el, val) => el.style.fontFamily = val,
            propFontSize: (el, val) => el.style.fontSize = val + 'px',
            propFontWeight: (el, val) => el.style.fontWeight = val,
            propColor: (el, val) => el.style.color = val,
            propBg: (el, val) => el.style.backgroundColor = val,
            propPadding: (el, val) => el.style.padding = val + 'px',
            propMargin: (el, val) => el.style.margin = val + 'px',
            propWidth: (el, val) => el.style.width = val === 'auto' ? 'auto' : val + 'px',
            propHeight: (el, val) => el.style.height = val === 'auto' ? 'auto' : val + 'px',
            propBorderWidth: (el, val) => el.style.borderWidth = val + 'px',
            propBorderStyle: (el, val) => el.style.borderStyle = val,
            propBorderColor: (el, val) => el.style.borderColor = val,
            propBorderRadius: (el, val) => el.style.borderRadius = val + 'px',
            propTextAlign: (el, val) => el.style.textAlign = val,
            propDisplay: (el, val) => el.style.display = val
        };

        Object.keys(styleUpdaters).forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                if(!selectedElement) return;
                styleUpdaters[id](selectedElement, e.target.value);
            });
            
            // Save state on change (debounced)
            let timeout;
            document.getElementById(id).addEventListener('change', () => {
                clearTimeout(timeout);
                timeout = setTimeout(() => saveState(), 500);
            });
        });

        // 4. Copy, Delete & Export Logic
        document.getElementById('copyBtn').addEventListener('click', () => {
            if(!selectedElement) return;
            selectedElement.classList.remove('active-inspect');
            const code = selectedElement.outerHTML;
            selectedElement.classList.add('active-inspect');
            
            navigator.clipboard.writeText(code).then(() => {
                const indicator = document.getElementById('copyIndicator');
                indicator.textContent = 'COPIED!';
                indicator.style.display = 'block';
                setTimeout(() => indicator.style.display = 'none', 2000);
            });
        });

        document.getElementById('deleteBtn').addEventListener('click', () => {
            if(!selectedElement) return;
            if(confirm('Delete this element?')) {
                selectedElement.remove();
                selectedElement = null;
                editorUI.style.display = 'none';
                emptyMsg.style.display = 'block';
                saveState(); // Save after delete
            }
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            const doc = viewer.contentWindow.document;
            // Remove inspector styles before export
            const inspectorStyle = doc.querySelector('style');
            if(inspectorStyle) inspectorStyle.remove();
            
            const html = doc.documentElement.outerHTML;
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'edited-design.html';
            a.click();
            URL.revokeObjectURL(url);
            
            // Re-add inspector styles
            setTimeout(() => initInspector(doc), 100);
        });

        function rgbToHex(rgb) {
            if (!rgb || rgb === 'transparent' || rgb.includes('rgba(0, 0, 0, 0)')) return '#ffffff';
            const res = rgb.match(/\d+/g);
            return res ? "#" + res.slice(0,3).map(x => parseInt(x).toString(16).padStart(2, '0')).join('') : '#ffffff';
        }
    </script>
</body>
</html>
