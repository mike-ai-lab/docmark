<!-- Mofu Embed Component -->
<style>
  .mofu-container {
    width: 180px; height: 180px;
    border: 12px solid #0f172a;
    border-radius: 50%;
    background: white;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    box-shadow: 0 0 30px #0f172a66;
  }
  .mofu-eyes {
    display: flex; gap: 52px;
    margin-bottom: 10px;
  }
  .mofu-eye {
    width: 18px; height: 18px;
    background: #0f172a; border-radius: 50%;
    animation: mofu-blink 10s infinite;
  }
  .mofu-mouth {
    width: 32px; height: 16px;
    border: 5px solid #0f172a;
    border-top: none; border-radius: 0 0 100px 100px;
  }
  @keyframes mofu-blink {
    0%, 90%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }
</style>
<div class="mofu-container">
  <div class="mofu-eyes">
    <div class="mofu-eye"></div>
    <div class="mofu-eye"></div>
  </div>
  <div class="mofu-mouth"></div>
</div>
