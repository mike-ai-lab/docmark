<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mofu Sphere Interaction</title>
    <style>
        /* Centering the UI in the middle of the screen */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .mofu-header-widget {
            --m-size: 80px; /* Increased size slightly for better visibility in center */
            --m-stroke: #0f172a;
            --m-accent: #3b82f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            perspective: 1200px;
            user-select: none;
        }

        .mofu-head {
            width: var(--m-size);
            height: var(--m-size);
            border: 4px solid var(--m-stroke);
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease-out, border-color 0.4s, box-shadow 0.4s;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #f0f0f0 100%);
            cursor: pointer;
        }

        .mofu-face-features {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            will-change: transform;
            transition: transform 0.1s ease-out;
        }

        .mofu-eyes-row {
            display: flex;
            gap: 14px;
            margin-bottom: 4px;
        }

        .mofu-dot {
            width: 8px;
            height: 11px;
            background: var(--m-stroke);
            border-radius: 50%;
            animation: mofu-blink-small 4s infinite ease-in-out;
        }

        .mofu-smile {
            width: 14px;
            height: 7px;
            border: 2.5px solid var(--m-stroke);
            border-top: none;
            border-radius: 0 0 15px 15px;
        }

        /* Instructions text */
        .hint {
            font-size: 14px;
            color: #64748b;
            text-align: center;
        }

        /* Animations */
        @keyframes mofu-sphere-jump {
            0% { transform: scale(1, 1) translateY(0); }
            15% { transform: scale(1.15, 0.8) translateY(5px); }
            45% { transform: scale(0.9, 1.1) translateY(-35px) rotate(180deg); }
            75% { transform: scale(1.05, 0.95) translateY(0); }
            100% { transform: scale(1, 1) translateY(0) rotate(360deg); }
        }
        .mofu-jumping { animation: mofu-sphere-jump 0.8s cubic-bezier(0.45, 0, 0.55, 1) forwards; }

        @keyframes mofu-sphere-spin {
            0% { transform: translateX(0); opacity: 1; }
            45% { transform: translateX(40px); opacity: 0; }
            50% { transform: translateX(-40px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .mofu-spinning-features { animation: mofu-sphere-spin 0.6s ease-in-out forwards; }
        
        @keyframes mofu-head-glow {
            0% { border-color: var(--m-stroke); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
            50% { border-color: var(--m-accent); box-shadow: 0 0 25px var(--m-accent); transform: scale(1.1); }
            100% { border-color: var(--m-stroke); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        }
        .mofu-glowing { animation: mofu-head-glow 0.6s ease-in-out forwards; }

        @keyframes mofu-blink-small {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .test-btn {
            padding: 12px 24px;
            background: #0f172a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.1s, background 0.2s;
        }
        .test-btn:hover { background: #1e293b; }
        .test-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="mofu-header-widget">
    <div class="hint">Move your mouse to look around<br>Click the blob to jump</div>
    
    <div class="mofu-head" id="mofu-canvas">
        <div class="mofu-face-features" id="mofu-features">
            <div class="mofu-eyes-row">
                <div class="mofu-dot"></div>
                <div class="mofu-dot"></div>
            </div>
            <div class="mofu-smile"></div>
        </div>
    </div>

    <button class="test-btn" onclick="triggerCopyReaction()">Test Sphere Spin</button>
</div>

<script>
    (function() {
        const canvas = document.getElementById('mofu-canvas');
        const features = document.getElementById('mofu-features');
        let isAnimating = false;

        // Track mouse movement for the spherical look effect
        document.addEventListener('mousemove', (e) => {
            if (isAnimating) return;
            const rect = canvas.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const dx = (e.clientX - centerX) / (window.innerWidth / 2);
            const dy = (e.clientY - centerY) / (window.innerHeight / 2);
            
            // Spherical mapping: movement is curved
            const xShift = dx * 20;
            const yShift = dy * 12;
            
            // Tilt the head slightly to enhance the 3D feel
            canvas.style.transform = `rotateX(${dy * -20}deg) rotateY(${dx * 20}deg)`;
            // Move features to simulate wrapping around a sphere
            features.style.transform = `translate3d(${xShift}px, ${yShift}px, 0)`;
        });

        // Jump animation on click
        canvas.addEventListener('click', () => {
            if (isAnimating) return;
            isAnimating = true;
            canvas.style.transform = '';
            features.style.transform = '';
            canvas.classList.add('mofu-jumping');
            setTimeout(() => {
                canvas.classList.add('mofu-glowing'); // Small glow landing effect
                setTimeout(() => canvas.classList.remove('mofu-glowing'), 600);
                canvas.classList.remove('mofu-jumping');
                isAnimating = false;
            }, 800);
        });

        // Spin animation (also triggers on Ctrl+C / Cmd+C)
        window.triggerCopyReaction = function() {
            if (isAnimating) return;
            isAnimating = true;

            canvas.style.transform = '';
            features.style.transform = '';
            
            features.classList.add('mofu-spinning-features');
            canvas.classList.add('mofu-glowing');

            setTimeout(() => {
                features.classList.remove('mofu-spinning-features');
                canvas.classList.remove('mofu-glowing');
                isAnimating = false;
            }, 600);
        };

        // Listen for the copy event
        document.addEventListener('copy', triggerCopyReaction);
    })();
</script>

</body>
</html>
