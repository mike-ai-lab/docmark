<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mofu Photo Session</title>
    <!-- Using html2canvas to allow taking "photos" of the DOM element -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Session Container */
        .photo-studio {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 40px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 90%;
        }

        .mofu-header-widget {
            --m-size: 100px;
            --m-stroke: #0f172a;
            --m-accent: #3b82f6;
            perspective: 1200px;
            user-select: none;
            padding: 20px; /* Space for the "flash" effect */
        }

        .mofu-head {
            width: var(--m-size);
            height: var(--m-size);
            border: 4px solid var(--m-stroke);
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease-out, border-color 0.4s, box-shadow 0.4s;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #f0f0f0 100%);
            cursor: pointer;
        }

        .mofu-face-features {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            will-change: transform;
            transition: transform 0.1s ease-out;
        }

        .mofu-eyes-row {
            display: flex;
            gap: 16px;
            margin-bottom: 4px;
        }

        .mofu-dot {
            width: 10px;
            height: 14px;
            background: var(--m-stroke);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .mofu-smile {
            width: 18px;
            height: 9px;
            border: 3px solid var(--m-stroke);
            border-top: none;
            border-radius: 0 0 15px 15px;
            transition: all 0.3s ease;
        }

        /* Expression States */
        .mofu-head[data-mood="surprised"] .mofu-dot { height: 12px; width: 12px; }
        .mofu-head[data-mood="surprised"] .mofu-smile { height: 12px; width: 12px; border-top: 3px solid var(--m-stroke); border-radius: 50%; }
        
        .mofu-head[data-mood="sleepy"] .mofu-dot { height: 3px; transform: scaleY(0.5); }
        .mofu-head[data-mood="sleepy"] .mofu-smile { width: 10px; border-radius: 0; height: 0; }

        .mofu-head[data-mood="cool"] .mofu-dot { height: 4px; width: 14px; border-radius: 2px; }
        .mofu-head[data-mood="cool"] .mofu-smile { width: 20px; border-radius: 0 0 4px 4px; height: 4px; }

        /* UI Controls */
        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
        }

        .btn {
            padding: 10px;
            border: 1px solid #e2e8f0;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn:hover { background: #f8fafc; border-color: #cbd5e1; }
        .btn.active { background: #0f172a; color: white; border-color: #0f172a; }

        .snapshot-btn {
            grid-column: span 2;
            background: #3b82f6;
            color: white;
            border: none;
            font-weight: 600;
            padding: 14px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .snapshot-btn:hover { background: #2563eb; }

        /* Camera Flash Effect */
        @keyframes camera-flash {
            0% { background: white; opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
        .flash-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            pointer-events: none;
            z-index: 100;
            opacity: 0;
        }
        .flashing { animation: camera-flash 0.2s ease-out; }

        /* Mofu Animations */
        @keyframes mofu-jump {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }
        .mofu-jumping { animation: mofu-jump 0.5s ease-in-out; }
    </style>
</head>
<body>

<div class="flash-overlay" id="flash"></div>

<div class="photo-studio">
    <h2 style="margin: 0; font-size: 18px; color: #1e293b;">Mofu Photo Studio</h2>
    
    <div class="mofu-header-widget" id="capture-area">
        <div class="mofu-head" id="mofu-canvas" data-mood="happy">
            <div class="mofu-face-features" id="mofu-features">
                <div class="mofu-eyes-row">
                    <div class="mofu-dot"></div>
                    <div class="mofu-dot"></div>
                </div>
                <div class="mofu-smile"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn active" onclick="setMood('happy', this)">Happy</button>
        <button class="btn" onclick="setMood('surprised', this)">Surprised</button>
        <button class="btn" onclick="setMood('cool', this)">Cool</button>
        <button class="btn" onclick="setMood('sleepy', this)">Sleepy</button>
        
        <button class="btn snapshot-btn" onclick="takePhoto()">
            📸 Take Snapshot
        </button>
    </div>
    
    <div id="gallery-label" style="font-size: 12px; color: #94a3b8; display: none;">Last photo saved!</div>
</div>

<script>
    const canvas = document.getElementById('mofu-canvas');
    const features = document.getElementById('mofu-features');
    const flash = document.getElementById('flash');
    const galleryLabel = document.getElementById('gallery-label');
    let isAnimating = false;

    // 1. Mouse Interaction Logic
    document.addEventListener('mousemove', (e) => {
        if (isAnimating) return;
        const rect = canvas.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        const dx = (e.clientX - centerX) / (window.innerWidth / 2);
        const dy = (e.clientY - centerY) / (window.innerHeight / 2);
        
        canvas.style.transform = `rotateX(${dy * -20}deg) rotateY(${dx * 20}deg)`;
        features.style.transform = `translate3d(${dx * 20}px, ${dy * 12}px, 0)`;
    });

    // 2. Expression Control
    window.setMood = (mood, btn) => {
        canvas.setAttribute('data-mood', mood);
        
        // Update UI buttons
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        // Small feedback jump
        canvas.classList.add('mofu-jumping');
        setTimeout(() => canvas.classList.remove('mofu-jumping'), 500);
    };

    // 3. Snapshot Logic
    window.takePhoto = async () => {
        if (isAnimating) return;
        isAnimating = true;

        // Reset transform for a "straight" photo
        canvas.style.transform = '';
        features.style.transform = '';

        // Trigger Flash
        flash.classList.add('flashing');
        setTimeout(() => flash.classList.remove('flashing'), 200);

        try {
            const captureArea = document.getElementById('capture-area');
            const canvasImg = await html2canvas(captureArea, {
                backgroundColor: null,
                scale: 2 // High resolution
            });
            
            // Create download link
            const link = document.createElement('a');
            link.download = `mofu-${canvas.getAttribute('data-mood')}-${Date.now()}.png`;
            link.href = canvasImg.toDataURL("image/png");
            link.click();
            
            galleryLabel.style.display = 'block';
        } catch (err) {
            console.error("Photo failed:", err);
        }

        setTimeout(() => { isAnimating = false; }, 500);
    };

    // Interaction feedback
    canvas.addEventListener('click', () => {
        if (isAnimating) return;
        canvas.classList.add('mofu-jumping');
        setTimeout(() => canvas.classList.remove('mofu-jumping'), 500);
    });

</script>

</body>
</html>
