<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Rendering Unit Tests - DocMark</title>
    
    <!-- Load dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 40px 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px solid #334155;
        }
        
        h1 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 16px;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }
        
        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }
        
        .btn-secondary:hover {
            background: #475569;
        }
        
        .status-bar {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-passed .stat-value {
            color: #10b981;
        }
        
        .stat-failed .stat-value {
            color: #ef4444;
        }
        
        .stat-total .stat-value {
            color: #3b82f6;
        }
        
        .stat-percentage .stat-value {
            color: #8b5cf6;
        }
        
        #console-output {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.8;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        
        #console-output:empty::before {
            content: 'Click "Run Tests" to start...';
            color: #64748b;
            font-style: italic;
        }
        
        .log-pass {
            color: #10b981;
        }
        
        .log-fail {
            color: #ef4444;
        }
        
        .log-info {
            color: #3b82f6;
        }
        
        .log-warn {
            color: #f59e0b;
        }
        
        .log-section {
            color: #8b5cf6;
            font-weight: 600;
            margin-top: 15px;
        }
        
        .log-summary {
            color: #e2e8f0;
            font-weight: 600;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #334155;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .test-status {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .test-status.running {
            background: #1e40af;
            color: white;
        }
        
        .test-status.success {
            background: #065f46;
            color: white;
        }
        
        .test-status.failure {
            background: #991b1b;
            color: white;
        }
        
        .hidden {
            display: none;
        }
        
        /* Scrollbar styling */
        #console-output::-webkit-scrollbar {
            width: 10px;
        }
        
        #console-output::-webkit-scrollbar-track {
            background: #0f172a;
            border-radius: 5px;
        }
        
        #console-output::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 5px;
        }
        
        #console-output::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧪 HTML Rendering Unit Tests</h1>
            <p class="subtitle">Comprehensive testing suite for DocMark HTML rendering compatibility</p>
        </header>
        
        <div class="controls">
            <button class="btn-primary" id="run-tests">▶️ Run Tests</button>
            <button class="btn-secondary" id="clear-console">🗑️ Clear Console</button>
            <button class="btn-secondary" id="export-results">📥 Export Results</button>
        </div>
        
        <div id="test-status" class="test-status hidden"></div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        
        <div class="status-bar">
            <div class="stat stat-total">
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">Total Tests</div>
            </div>
            <div class="stat stat-passed">
                <div class="stat-value" id="stat-passed">0</div>
                <div class="stat-label">Passed</div>
            </div>
            <div class="stat stat-failed">
                <div class="stat-value" id="stat-failed">0</div>
                <div class="stat-label">Failed</div>
            </div>
            <div class="stat stat-percentage">
                <div class="stat-value" id="stat-percentage">0%</div>
                <div class="stat-label">Success Rate</div>
            </div>
        </div>
        
        <div id="console-output"></div>
    </div>
    
    <script>
        // Console output capture
        const consoleOutput = document.getElementById('console-output');
        const originalConsole = {
            log: console.log,
            error: console.error,
            warn: console.warn
        };
        
        function appendToConsole(message, type = 'log') {
            const span = document.createElement('span');
            span.className = `log-${type}`;
            span.textContent = message + '\n';
            consoleOutput.appendChild(span);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
        
        // Override console methods
        console.log = function(...args) {
            const message = args.join(' ');
            originalConsole.log(...args);
            
            if (message.includes('✅')) {
                appendToConsole(message, 'pass');
            } else if (message.includes('📦')) {
                appendToConsole(message, 'section');
            } else if (message.includes('='.repeat(10))) {
                appendToConsole(message, 'summary');
            } else {
                appendToConsole(message, 'info');
            }
        };
        
        console.error = function(...args) {
            const message = args.join(' ');
            originalConsole.error(...args);
            appendToConsole(message, 'fail');
        };
        
        console.warn = function(...args) {
            const message = args.join(' ');
            originalConsole.warn(...args);
            appendToConsole(message, 'warn');
        };
        
        // Update stats
        function updateStats(results) {
            document.getElementById('stat-total').textContent = results.total;
            document.getElementById('stat-passed').textContent = results.passed;
            document.getElementById('stat-failed').textContent = results.failed;
            
            const percentage = results.total > 0 
                ? ((results.passed / results.total) * 100).toFixed(1)
                : 0;
            document.getElementById('stat-percentage').textContent = percentage + '%';
            
            // Update progress bar
            document.getElementById('progress-fill').style.width = percentage + '%';
        }
        
        // Update test status
        function updateTestStatus(status, message) {
            const statusEl = document.getElementById('test-status');
            statusEl.className = 'test-status ' + status;
            statusEl.textContent = message;
            statusEl.classList.remove('hidden');
        }
        
        // Run tests button
        document.getElementById('run-tests').addEventListener('click', async () => {
            consoleOutput.innerHTML = '';
            updateStats({ total: 0, passed: 0, failed: 0 });
            updateTestStatus('running', '⏳ Running tests...');
            
            // Small delay to show running status
            await new Promise(resolve => setTimeout(resolve, 100));
            
            try {
                // Load and execute test script
                const response = await fetch('test-html-rendering-unit.js');
                const testCode = await response.text();
                
                // Execute tests
                eval(testCode);
                
                // Get results from global scope
                if (typeof results !== 'undefined') {
                    updateStats(results);
                    
                    if (results.failed === 0) {
                        updateTestStatus('success', '✅ All tests passed!');
                    } else {
                        updateTestStatus('failure', `⚠️ ${results.failed} test(s) failed`);
                    }
                }
            } catch (error) {
                console.error('Error running tests:', error);
                updateTestStatus('failure', '❌ Test execution failed');
            }
        });
        
        // Clear console button
        document.getElementById('clear-console').addEventListener('click', () => {
            consoleOutput.innerHTML = '';
            updateStats({ total: 0, passed: 0, failed: 0 });
            document.getElementById('test-status').classList.add('hidden');
            document.getElementById('progress-fill').style.width = '0%';
        });
        
        // Export results button
        document.getElementById('export-results').addEventListener('click', () => {
            if (typeof results === 'undefined' || results.total === 0) {
                alert('No test results to export. Run tests first.');
                return;
            }
            
            const exportData = {
                timestamp: new Date().toISOString(),
                summary: {
                    total: results.total,
                    passed: results.passed,
                    failed: results.failed,
                    successRate: ((results.passed / results.total) * 100).toFixed(1) + '%'
                },
                tests: results.tests
            };
            
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `test-results-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });
        
        // Auto-run tests on load (optional)
        // document.getElementById('run-tests').click();
    </script>
</body>
</html>
