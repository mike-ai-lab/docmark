<!DOCTYPE html>
<html>
<head>
    <title>Monaco Blank Line Insertion Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .test-section { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .test-section h3 { margin-top: 0; }
        pre { background: #f5f5f5; padding: 10px; }
        .pass { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Monaco Editor Blank Line Insertion Test</h1>
    <div id="results"></div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <script>
        require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' } });
        
        require(['vs/editor/editor.main'], function() {
            const results = document.getElementById('results');
            
            function addResult(testName, input, output, expected, passed) {
                const section = document.createElement('div');
                section.className = 'test-section';
                section.innerHTML = `
                    <h3>${testName} - <span class="${passed ? 'pass' : 'fail'}">${passed ? 'PASS' : 'FAIL'}</span></h3>
                    <div><strong>Input:</strong></div>
                    <pre>${input}</pre>
                    <div><strong>Output:</strong></div>
                    <pre>${output}</pre>
                    <div><strong>Expected:</strong></div>
                    <pre>${expected}</pre>
                `;
                results.appendChild(section);
            }
            
            // Test 1: Insert blank line after heading
            function test1() {
                const container = document.createElement('div');
                container.style.width = '800px';
                container.style.height = '200px';
                container.style.display = 'none';
                document.body.appendChild(container);
                
                const editor = monaco.editor.create(container, {
                    value: '### 42. Professional Protocol Check\n- Visit our Riyadh Office',
                    language: 'markdown'
                });
                
                const model = editor.getModel();
                const input = model.getValue();
                
                // Insert blank line before line 2
                const range = new monaco.Range(2, 1, 2, 1);
                editor.executeEdits('test', [{
                    range: range,
                    text: '\n'
                }]);
                
                const output = model.getValue();
                const expected = '### 42. Professional Protocol Check\n\n- Visit our Riyadh Office';
                const passed = output === expected;
                
                addResult('Test 1: Insert blank line after heading', input, output, expected, passed);
                
                editor.dispose();
                container.remove();
                
                return passed;
            }
            
            // Test 2: Insert blank line between list and table
            function test2() {
                const container = document.createElement('div');
                container.style.width = '800px';
                container.style.height = '200px';
                container.style.display = 'none';
                document.body.appendChild(container);
                
                const editor = monaco.editor.create(container, {
                    value: '### 43. List-Table Conflict\n1. This is a list item\n| Table | Inside | List? |',
                    language: 'markdown'
                });
                
                const model = editor.getModel();
                const input = model.getValue();
                
                // Insert blank line before line 3
                const range = new monaco.Range(3, 1, 3, 1);
                editor.executeEdits('test', [{
                    range: range,
                    text: '\n'
                }]);
                
                const output = model.getValue();
                const expected = '### 43. List-Table Conflict\n1. This is a list item\n\n| Table | Inside | List? |';
                const passed = output === expected;
                
                addResult('Test 2: Insert blank line between list and table', input, output, expected, passed);
                
                editor.dispose();
                container.remove();
                
                return passed;
            }
            
            // Test 3: Idempotency - don't insert if already exists
            function test3() {
                const container = document.createElement('div');
                container.style.width = '800px';
                container.style.height = '200px';
                container.style.display = 'none';
                document.body.appendChild(container);
                
                const editor = monaco.editor.create(container, {
                    value: '### Heading\n\nAlready has blank line above',
                    language: 'markdown'
                });
                
                const model = editor.getModel();
                const input = model.getValue();
                
                // Check if line 2 is blank
                const line2 = model.getLineContent(2);
                const shouldSkip = line2.trim() === '';
                
                let output;
                if (shouldSkip) {
                    output = input; // Don't insert
                } else {
                    // Insert blank line before line 3
                    const range = new monaco.Range(3, 1, 3, 1);
                    editor.executeEdits('test', [{
                        range: range,
                        text: '\n'
                    }]);
                    output = model.getValue();
                }
                
                const expected = '### Heading\n\nAlready has blank line above';
                const passed = output === expected && shouldSkip;
                
                addResult('Test 3: Idempotency check', input, output, expected, passed);
                
                editor.dispose();
                container.remove();
                
                return passed;
            }
            
            // Run all tests
            const test1Result = test1();
            const test2Result = test2();
            const test3Result = test3();
            
            // Summary
            const summary = document.createElement('div');
            summary.className = 'test-section';
            const allPassed = test1Result && test2Result && test3Result;
            summary.innerHTML = `
                <h2>Summary - <span class="${allPassed ? 'pass' : 'fail'}">${allPassed ? 'ALL TESTS PASSED' : 'SOME TESTS FAILED'}</span></h2>
                <p>Test 1: ${test1Result ? '✅ PASS' : '❌ FAIL'}</p>
                <p>Test 2: ${test2Result ? '✅ PASS' : '❌ FAIL'}</p>
                <p>Test 3: ${test3Result ? '✅ PASS' : '❌ FAIL'}</p>
            `;
            results.appendChild(summary);
        });
    </script>
</body>
</html>
