<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Element Inspector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Toast Animation */
        @keyframes slideIn {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        .toast-enter {
            animation: slideIn 0.3s ease-out forwards;
        }

        /* Resizable Splitter Handle */
        .resizer {
            cursor: row-resize;
            height: 4px;
            background: #e2e8f0;
            transition: background 0.2s;
        }
        .resizer:hover {
            background: #6366f1;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800">

    <!-- Header: Minimalist Browser Bar -->
    <header class="bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between shrink-0 z-20 shadow-sm">
        <div class="flex items-center gap-4 w-full">
            <div class="flex gap-1.5">
                <div class="w-3 h-3 rounded-full bg-red-400"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
                <div class="w-3 h-3 rounded-full bg-green-400"></div>
            </div>
            <!-- Fake URL Bar -->
            <div class="flex-1 max-w-2xl bg-slate-100 rounded-md px-3 py-1.5 text-xs text-slate-500 font-mono flex items-center">
                <i class="fa-solid fa-lock text-slate-400 mr-2"></i>
                <span>preview://canvas-render</span>
            </div>
            <div class="text-xs text-slate-400 font-semibold">
                HTML Inspector v2.0
            </div>
        </div>
    </header>

    <!-- Main Workspace (Vertical Layout) -->
    
    <!-- 1. PREVIEW AREA (The Focus) -->
    <main class="flex-1 bg-white relative overflow-auto bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9IiNmMWY1ZjkiLz48L3N2Zz4=')]">
        <!-- Render Host: Needs to be full width/height to simulate browser -->
        <div id="render-host" class="w-full min-h-full block"></div>

        <!-- Toast Notification (Centered Bottom of Preview) -->
        <div id="notification-toast" class="hidden absolute bottom-8 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-full shadow-xl z-50 flex items-center gap-3 border border-slate-700 pointer-events-none">
            <div class="text-green-400"><i class="fa-solid fa-circle-check"></i></div>
            <div>
                <p class="text-sm font-medium">Element Copied</p>
            </div>
        </div>
    </main>

    <!-- Resizer Handle -->
    <div class="resizer w-full shrink-0"></div>

    <!-- 2. EDITOR PANEL (Bottom Dock) -->
    <section class="h-64 bg-white border-t border-slate-200 flex flex-col shrink-0 shadow-[0_-4px_20px_-5px_rgba(0,0,0,0.1)] z-30">
        <!-- Toolbar -->
        <div class="flex border-b border-slate-200 bg-slate-50">
            <div class="px-4 py-2 text-xs font-bold text-indigo-600 bg-white border-r border-t-2 border-t-indigo-600 border-r-slate-200">
                <i class="fa-solid fa-code mr-2"></i>Source & Verify
            </div>
            <div class="flex-1 flex justify-end px-2 items-center">
                 <button onclick="clearAll()" class="text-[10px] uppercase font-bold text-slate-400 hover:text-red-500 px-3 py-1 transition-colors">Clear All</button>
            </div>
        </div>

        <!-- Inputs Container -->
        <div class="flex-1 flex divide-x divide-slate-200">
            
            <!-- Input: Paste HTML -->
            <div class="flex-1 flex flex-col relative group">
                <textarea id="source-input" class="w-full h-full p-4 font-mono text-xs md:text-sm resize-none focus:outline-none focus:bg-indigo-50/10 transition-colors text-slate-700 leading-relaxed" 
                    placeholder="<!-- PASTE HTML HERE -->
<div style='width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);'>
    <div style='background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center;'>
        <h1 style='margin: 0 0 10px; color: #333;'>Hello World</h1>
        <p style='color: #666;'>Right-click this card to copy its code!</p>
        <button style='margin-top: 20px; padding: 10px 20px; background: #333; color: white; border: none; border-radius: 6px; cursor: pointer;'>Call to Action</button>
    </div>
</div>" spellcheck="false"></textarea>
                <div class="absolute top-2 right-2 px-2 py-1 bg-slate-100 text-slate-500 text-[10px] font-bold rounded border border-slate-200 pointer-events-none opacity-50 group-hover:opacity-100 transition-opacity">INPUT</div>
            </div>

            <!-- Input: Verify -->
            <div class="w-1/3 min-w-[300px] flex flex-col relative group bg-slate-50/50">
                <textarea id="verify-input" class="w-full h-full p-4 font-mono text-xs md:text-sm resize-none focus:outline-none focus:bg-green-50/10 transition-colors text-slate-600 border-l-4 border-transparent focus:border-green-400" 
                    placeholder="Verify Clipboard: Paste here to check what you copied..." spellcheck="false"></textarea>
                <div class="absolute top-2 right-2 px-2 py-1 bg-slate-100 text-slate-500 text-[10px] font-bold rounded border border-slate-200 pointer-events-none opacity-50 group-hover:opacity-100 transition-opacity">VERIFY</div>
            </div>

        </div>
    </section>

    <script>
        // DOM Elements
        const sourceInput = document.getElementById('source-input');
        const renderHost = document.getElementById('render-host');
        const verifyInput = document.getElementById('verify-input');
        const toast = document.getElementById('notification-toast');

        // Shadow DOM Setup
        const shadowRoot = renderHost.attachShadow({ mode: 'open' });

        function render() {
            const html = sourceInput.value;
            // Enhanced Styles for Full Page Simulation
            shadowRoot.innerHTML = `
                <style>
                    :host { 
                        display: block; 
                        width: 100%;
                        height: 100%;
                        /* Reset basic inheritance to act like a fresh body */
                        font-family: sans-serif;
                        color: black;
                        text-align: left;
                        line-height: normal;
                    }
                    /* Ensure full height layouts work */
                    body, html {
                        margin: 0;
                        padding: 0;
                        width: 100%;
                        min-height: 100%;
                    }
                    /* Highlight effect */
                    *:hover { 
                        outline: 2px dashed #6366f1 !important; 
                        outline-offset: -2px;
                        cursor: copy !important;
                    }
                </style>
                ${html}
            `;
        }

        // Live Render on Input
        sourceInput.addEventListener('input', render);

        // Right Click Handler
        renderHost.addEventListener('contextmenu', (e) => {
            e.preventDefault(); 
            const path = e.composedPath();
            let targetElement = path[0];

            if (targetElement.nodeType === Node.TEXT_NODE) {
                targetElement = targetElement.parentElement;
            }

            // Prevent copying the root container
            if (targetElement === renderHost || targetElement === shadowRoot) return;

            // Get Code
            const codeToCopy = targetElement.outerHTML;

            // Copy
            copyToClipboard(codeToCopy);
            
            // Visual Feedback
            showToast();
        });

        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
            } catch (err) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            }
        }

        let toastTimeout;
        function showToast() {
            clearTimeout(toastTimeout);
            toast.classList.remove('hidden');
            toast.classList.add('toast-enter');
            toastTimeout = setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('toast-enter');
            }, 1500);
        }

        function clearAll() {
            sourceInput.value = '';
            verifyInput.value = '';
            render();
        }

        // Initialize
        render();

    </script>
</body>
</html>
