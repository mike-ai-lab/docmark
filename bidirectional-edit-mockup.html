<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bidirectional Editing Mockup</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 12px 20px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .toggle-btn {
            padding: 8px 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .toggle-btn.active {
            background: #10b981;
        }
        
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e2e8f0;
        }
        
        .pane:last-child {
            border-right: none;
        }
        
        .pane-header {
            padding: 8px 16px;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
        }
        
        .pane-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        #markdown-editor {
            width: 100%;
            height: 100%;
            border: none;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            padding: 20px;
        }
        
        .preview-content {
            line-height: 1.6;
        }
        
        .preview-content h1 {
            font-size: 2em;
            margin: 0.67em 0;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.3em;
        }
        
        .preview-content h2 {
            font-size: 1.5em;
            margin: 0.75em 0;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.3em;
        }
        
        .preview-content h3 {
            font-size: 1.25em;
            margin: 1em 0;
        }
        
        .preview-content p {
            margin: 1em 0;
        }
        
        .preview-content ul, .preview-content ol {
            margin: 1em 0;
            padding-left: 2em;
        }
        
        .preview-content li {
            margin: 0.5em 0;
        }
        
        .preview-content code {
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        .preview-content pre {
            background: #f1f5f9;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 1em 0;
        }
        
        .preview-content pre code {
            background: none;
            padding: 0;
        }
        
        /* Editable mode styles */
        .edit-mode .editable-element {
            cursor: pointer;
            padding: 4px;
            margin: -4px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        
        .edit-mode .editable-element:hover {
            background: #fef3c7;
            outline: 2px solid #fbbf24;
        }
        
        .inline-editor {
            position: relative;
            margin: 8px 0;
        }
        
        .inline-editor textarea {
            width: 100%;
            min-height: 80px;
            padding: 12px;
            border: 2px solid #3b82f6;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
        }
        
        .inline-editor-buttons {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        
        .inline-editor-buttons button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        
        .save-btn {
            background: #10b981;
            color: white;
        }
        
        .cancel-btn {
            background: #94a3b8;
            color: white;
        }
        
        .info {
            padding: 8px 12px;
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
            font-size: 13px;
            color: #1e40af;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="toggle-btn" id="edit-mode-toggle">Enable Edit Mode</button>
        <div class="info">Click elements in preview to edit them when Edit Mode is enabled</div>
    </div>
    
    <div class="container">
        <div class="pane">
            <div class="pane-header">Markdown Source</div>
            <textarea id="markdown-editor" placeholder="Type your markdown here..."># Welcome to Bidirectional Editing

This is a **mockup** to test inline editing in the preview pane.

## How it works

1. Click "Enable Edit Mode" button
2. Click any element in the preview (heading, paragraph, list, etc.)
3. Edit the markdown in the inline editor
4. Click "Save" to update both panes

## Features to test

- Edit headings
- Edit paragraphs with **bold** and *italic*
- Edit lists like this one
- Edit code blocks

Try clicking on different elements!

### Code Example

\`\`\`javascript
function hello() {
    console.log("Click me to edit!");
}
\`\`\`

### Another paragraph

You can edit this paragraph by clicking on it when edit mode is enabled. The changes will sync back to the markdown editor on the left.</textarea>
        </div>
        
        <div class="pane">
            <div class="pane-header">Preview (Click elements to edit)</div>
            <div class="pane-content">
                <div id="preview" class="preview-content"></div>
            </div>
        </div>
    </div>
    
    <script>
        const editor = document.getElementById('markdown-editor');
        const preview = document.getElementById('preview');
        const toggleBtn = document.getElementById('edit-mode-toggle');
        let editMode = false;
        let currentlyEditing = null;
        
        // Store markdown source for each element
        const elementSourceMap = new Map();
        
        function renderMarkdown() {
            const markdown = editor.value;
            const lines = markdown.split('\n');
            let html = '';
            let currentBlock = '';
            let lineStart = 0;
            
            // Simple block parser to track line numbers
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                
                // Detect block boundaries
                if (line.trim() === '' || 
                    line.startsWith('#') || 
                    (i > 0 && lines[i-1].trim() !== '' && line.trim() !== '')) {
                    
                    if (currentBlock.trim()) {
                        const blockId = `block-${lineStart}`;
                        const blockHtml = marked.parse(currentBlock);
                        html += `<div class="editable-element" data-block-id="${blockId}" data-line-start="${lineStart}">${blockHtml}</div>`;
                        elementSourceMap.set(blockId, currentBlock);
                        currentBlock = '';
                        lineStart = i;
                    }
                }
                
                currentBlock += line + '\n';
            }
            
            // Handle last block
            if (currentBlock.trim()) {
                const blockId = `block-${lineStart}`;
                const blockHtml = marked.parse(currentBlock);
                html += `<div class="editable-element" data-block-id="${blockId}" data-line-start="${lineStart}">${blockHtml}</div>`;
                elementSourceMap.set(blockId, currentBlock);
            }
            
            preview.innerHTML = html;
            attachClickHandlers();
        }
        
        function attachClickHandlers() {
            if (!editMode) return;
            
            const elements = preview.querySelectorAll('.editable-element');
            elements.forEach(el => {
                el.addEventListener('click', (e) => {
                    if (currentlyEditing) return;
                    e.stopPropagation();
                    startEditing(el);
                });
            });
        }
        
        function startEditing(element) {
            const blockId = element.dataset.blockId;
            const lineStart = parseInt(element.dataset.lineStart);
            const source = elementSourceMap.get(blockId) || '';
            
            currentlyEditing = { element, blockId, lineStart, source };
            
            // Create inline editor
            const editorDiv = document.createElement('div');
            editorDiv.className = 'inline-editor';
            editorDiv.innerHTML = `
                <textarea id="inline-textarea">${source.trim()}</textarea>
                <div class="inline-editor-buttons">
                    <button class="save-btn">Save</button>
                    <button class="cancel-btn">Cancel</button>
                </div>
            `;
            
            // Replace element with editor
            element.style.display = 'none';
            element.parentNode.insertBefore(editorDiv, element.nextSibling);
            
            const textarea = editorDiv.querySelector('textarea');
            textarea.focus();
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);
            
            // Save button
            editorDiv.querySelector('.save-btn').addEventListener('click', () => {
                saveEdit(textarea.value);
            });
            
            // Cancel button
            editorDiv.querySelector('.cancel-btn').addEventListener('click', () => {
                cancelEdit();
            });
            
            // Save on Ctrl+Enter
            textarea.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'Enter') {
                    saveEdit(textarea.value);
                }
                if (e.key === 'Escape') {
                    cancelEdit();
                }
            });
        }
        
        function saveEdit(newMarkdown) {
            if (!currentlyEditing) return;
            
            const { lineStart, source } = currentlyEditing;
            const lines = editor.value.split('\n');
            
            // Find the block in the editor
            const sourceLines = source.split('\n');
            const newLines = newMarkdown.split('\n');
            
            // Replace the lines
            const endLine = lineStart + sourceLines.length;
            lines.splice(lineStart, sourceLines.length, ...newLines);
            
            // Update editor
            editor.value = lines.join('\n');
            
            // Clean up
            cancelEdit();
            
            // Re-render
            renderMarkdown();
        }
        
        function cancelEdit() {
            if (!currentlyEditing) return;
            
            const editorDiv = document.querySelector('.inline-editor');
            if (editorDiv) {
                editorDiv.remove();
            }
            
            currentlyEditing.element.style.display = '';
            currentlyEditing = null;
        }
        
        // Toggle edit mode
        toggleBtn.addEventListener('click', () => {
            editMode = !editMode;
            
            if (editMode) {
                toggleBtn.textContent = 'Disable Edit Mode';
                toggleBtn.classList.add('active');
                preview.parentElement.parentElement.classList.add('edit-mode');
            } else {
                toggleBtn.textContent = 'Enable Edit Mode';
                toggleBtn.classList.remove('active');
                preview.parentElement.parentElement.classList.remove('edit-mode');
                if (currentlyEditing) {
                    cancelEdit();
                }
            }
            
            attachClickHandlers();
        });
        
        // Update preview on editor change
        editor.addEventListener('input', () => {
            if (!currentlyEditing) {
                renderMarkdown();
            }
        });
        
        // Initial render
        renderMarkdown();
    </script>
</body>
</html>
